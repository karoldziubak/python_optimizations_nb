[project]
name = "python-optimizations-nb"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ipytest>=0.14.2",
    "jupyter>=1.1.1",
    "line-profiler>=5.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "nbmake>=1.5.5",
]
